<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="730" viewBox="0 0 1100 730"><style>text{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif}</style><rect width="1100" height="730" rx="24" fill="#f3efe7"/><text x="56" y="72" font-size="28" font-weight="600" fill="#292923">Always within reach.</text><text x="56" y="107" font-size="18" fill="#68655d">Quick controls from the macOS menu bar.</text><rect x="56" y="136" width="440" height="33" rx="8" fill="#ddd8ce"/><circle cx="462" cy="152" r="9" fill="#33332d"/><path d="M462 143a9 9 0 0 1 0 18z" fill="#f6f1e7"/><rect x="56" y="175" width="440" height="527" rx="12" fill="#292824" stroke="#49473f"/><text x="78" y="204" font-size="16" fill="#b8b4ab">Grayscale · Warmth 50%</text><text x="78" y="226" font-size="13" fill="#a29e95">Temporary warmth override · Following stays on</text><path d="M70 240H482" stroke="#4b4941"/><text x="78" y="264" font-size="16" fill="#f0ece3">✓</text><text x="103" y="264" font-size="16" fill="#f0ece3">Grayscale</text><text x="103" y="294" font-size="15" fill="#f0ece3">Extra Warmth</text><text x="452" y="294" font-size="15" text-anchor="end" fill="#f0ece3">50%</text><rect x="103" y="309" width="348" height="5" rx="2" fill="#68655d"/><rect x="103" y="309" width="174" height="5" rx="2" fill="#e5b17b"/><circle cx="277" cy="311" r="8" fill="#eee8dc"/><text x="103" y="337" text-anchor="middle" font-size="11" fill="#b8b4ab">Off</text><text x="190" y="337" text-anchor="middle" font-size="11" fill="#b8b4ab">25</text><text x="277" y="337" text-anchor="middle" font-size="11" fill="#b8b4ab">50</text><text x="364" y="337" text-anchor="middle" font-size="11" fill="#b8b4ab">75</text><text x="451" y="337" text-anchor="middle" font-size="11" fill="#b8b4ab">Red</text><path d="M70 348H482" stroke="#4b4941"/><text x="78" y="372" font-size="16" fill="#f0ece3">✓</text><text x="103" y="372" font-size="16" fill="#f0ece3">Night Shift: On</text><text x="78" y="398" font-size="16" fill="#f0ece3"></text><text x="103" y="398" font-size="16" fill="#f0ece3">Turn Night Shift off for…</text><text x="467" y="398" font-size="17" fill="#b8b4ab">›</text><text x="78" y="424" font-size="16" fill="#f0ece3">✓</text><text x="103" y="424" font-size="16" fill="#f0ece3">Extra Warmth follows Night Shift</text><text x="78" y="450" font-size="16" fill="#f0ece3"></text><text x="103" y="450" font-size="16" fill="#f0ece3">Resume Following</text><path d="M70 464H482" stroke="#4b4941"/><text x="103" y="489" font-size="14" fill="#a29e95">Using global display settings</text><text x="78" y="516" font-size="16" fill="#f0ece3"></text><text x="103" y="516" font-size="16" fill="#f0ece3">App Exceptions…</text><text x="78" y="542" font-size="16" fill="#f0ece3"></text><text x="103" y="542" font-size="16" fill="#f0ece3">Customize current app…</text><text x="78" y="568" font-size="16" fill="#f0ece3"></text><text x="103" y="568" font-size="16" fill="#f0ece3">Install Browser Extension…</text><text x="78" y="594" font-size="16" fill="#f0ece3"></text><text x="103" y="594" font-size="16" fill="#f0ece3">Settings…</text><text x="78" y="620" font-size="16" fill="#f0ece3"></text><text x="103" y="620" font-size="16" fill="#f0ece3">Help</text><text x="467" y="620" font-size="17" fill="#b8b4ab">›</text><text x="78" y="646" font-size="16" fill="#f0ece3"></text><text x="103" y="646" font-size="16" fill="#f0ece3">About Less Pull…</text><text x="78" y="672" font-size="16" fill="#f0ece3"></text><text x="103" y="672" font-size="16" fill="#f0ece3">Quit</text><text x="550" y="213" font-size="23" font-weight="600" fill="#292923">Adjust the moment</text><text x="550" y="248" font-size="18" fill="#68655d">Toggle grayscale and adjust warmth</text><text x="550" y="275" font-size="18" fill="#68655d">without opening Settings.</text><text x="550" y="340" font-size="23" font-weight="600" fill="#292923">Keep your own rhythm</text><text x="550" y="375" font-size="18" fill="#68655d">Follow Night Shift, pause it briefly,</text><text x="550" y="402" font-size="18" fill="#68655d">or resume warmth following.</text><text x="550" y="467" font-size="23" font-weight="600" fill="#292923">Customize each app</text><text x="550" y="502" font-size="18" fill="#68655d">Open App Exceptions or customize</text><text x="550" y="529" font-size="18" fill="#68655d">the current app directly.</text><text x="550" y="601" font-size="15" fill="#777269">Website settings live in the browser extension.</text><text x="550" y="632" font-size="13" fill="#777269">Illustration of the current menu; labels and available</text><text x="550" y="652" font-size="13" fill="#777269">actions vary with state and the foreground app.</text></svg>